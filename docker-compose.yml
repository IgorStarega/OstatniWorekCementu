# OstatniWorekCementu — środowisko lokalne (PHP 8.2 + Apache + MySQL 8.0 + phpMyAdmin).
# Start: docker compose up -d --build
# App:        http://localhost:8082/
# phpMyAdmin: http://localhost:8084/
#
# Sekrety w .env (wzór: .env.example). .env jest w .gitignore.
# Świadomie NIE używamy env_file dla app i phpmyadmin — każdy serwis dostaje
# tylko te zmienne, których faktycznie potrzebuje.

x-arcane:
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/php.svg
  urls:
    - https://owc.dziadu.dev
    - https://github.com/IgorStarega/OstatniWorekCementu

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: owc-app
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:80"
    environment:
      TZ: Europe/Warsaw
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8082}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web-network

  db:
    image: mysql:8.0
    container_name: owc-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Warsaw
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/mysql:/etc/mysql/conf.d:ro
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - web-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: owc-phpmyadmin
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8084:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    depends_on:
      - db
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
