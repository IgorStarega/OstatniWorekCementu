# OstatniWorekCementu — wdrożenie z obrazu GHCR.
# Kod aplikacji jest w obrazie, więc nie ma wolumenu ./:/var/www/html.
# Start:  docker compose -f docker-compose.prod.yml pull
#         docker compose -f docker-compose.prod.yml up -d
# Update: docker compose -f docker-compose.prod.yml pull
#         docker compose -f docker-compose.prod.yml up -d
#
# Wymagane w .env: APP_URL (https://...), MYSQL_*; opcjonalnie
# IMAGE_TAG (domyślnie latest), BIND_ADDR, TRUSTED_PROXY_IPS.
# Sekrety zostają w .env (poza repozytorium).

services:
  app:
    image: ghcr.io/igorstarega/ostatniworekcementu:${IMAGE_TAG:-latest}
    container_name: owc-app
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:80"
    environment:
      TZ: Europe/Warsaw
      APP_ENV: prod
      APP_URL: ${APP_URL:?APP_URL jest wymagany w prod}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web-network

  db:
    image: mysql:8.0
    container_name: owc-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Warsaw
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/mysql:/etc/mysql/conf.d:ro
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - web-network

  # phpMyAdmin tylko na żądanie: --profile tools
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: owc-phpmyadmin
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8084:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    depends_on:
      - db
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
