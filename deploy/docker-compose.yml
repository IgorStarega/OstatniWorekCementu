# Deploy produkcyjny z obrazu GHCR. NIE do rozwoju — do rozwoju służy
# docker-compose.yml w katalogu głównym (build z kodu).
#
# WYMAGANE przed pierwszym startem:
#   1. cp .env.example .env   i uzupełnij hasła
#   2. cp ../database/database.sql ./database.sql
#      (import wykonuje się TYLKO przy pustym ./data/mysql)
#   3. opcjonalnie: cp -r ../config/mysql ./config/mysql
#
# Szczegóły i aktualizacje: deploy/README.md
#
# docker compose config nie wymaga .env (MYSQL_* są podstawiane przy starcie).
# Świadomie nie używamy env_file — każdy serwis dostaje tylko potrzebne zmienne.

services:
  app:
    image: ghcr.io/igorstarega/ostatniworekcementu:${IMAGE_TAG:-latest}
    container_name: owc-app
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:80"
    environment:
      TZ: Europe/Warsaw
      APP_ENV: ${APP_ENV:-prod}
      APP_URL: ${APP_URL}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/?page=home\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - web-network

  db:
    image: mysql:8.0
    container_name: owc-db
    restart: unless-stopped
    environment:
      TZ: Europe/Warsaw
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/mysql:/etc/mysql/conf.d:ro
      # WYMAGANY plik: skopiuj go z ../database/database.sql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - web-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: owc-phpmyadmin
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8084:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_USER: ${PMA_USER:-root}
      PMA_PASSWORD: ${PMA_PASSWORD}
      # Cloudflare Tunnel kończy TLS, kontener widzi HTTP.
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:-}
    depends_on:
      - db
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
