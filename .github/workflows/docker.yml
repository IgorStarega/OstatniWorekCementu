name: Obraz Docker (GHCR)

# Przepływ: lint -> test (docker compose + pełny smoke) -> publish.
# Test uruchamia dokładnie ten sam stos compose co lokalnie i wykonuje
# tools/qa-smoke.sh, więc pull requesty są sprawdzane funkcjonalnie, a nie
# tylko składniowo. Publikacja trafia do GHCR dopiero po przejściu testu.
#
# Tagi po publikacji:
#   main      -> latest, main, sha-<skrót>
#   vX.Y.Z    -> X.Y.Z, X.Y, sha-<skrót>
#   PR        -> brak publikacji

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Na main nie przerywamy publikacji — przerwany push do GHCR może zostawić
# niespójny manifest. Anulujemy tylko PR-y i tagi.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  BASE_URL: http://127.0.0.1:8082

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Konfiguracja PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Walidacja składni PHP
        run: |
          set -e
          find app config public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Walidacja składni JS
        run: node --check public/js/script.js

      - name: Walidacja składni skryptów bash
        run: bash -n tools/qa-smoke.sh

      - name: Walidacja konfiguracji Compose
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
          (cd deploy && docker compose --env-file .env.example config --quiet)

  test:
    name: Test stosu i smoke
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Przygotowanie .env
        run: cp .env.example .env

      - name: Budowa i start stosu
        run: docker compose up -d --build app

      - name: Oczekiwanie na bazę i schemat
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T db sh -c \
              'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -N -B -e "SELECT 1 FROM users LIMIT 1"' \
              >/dev/null 2>&1; then
              echo "Baza i schemat gotowe po ${attempt} próbach."
              exit 0
            fi
            sleep 2
          done
          echo "Baza nie jest gotowa w ciągu 120 s."
          docker compose logs --no-color --tail=200 db
          exit 1

      - name: Oczekiwanie na aplikację
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null "$BASE_URL/?page=home"; then
              echo "Aplikacja odpowiada po ${attempt} próbach."
              exit 0
            fi
            sleep 2
          done
          echo "Aplikacja nie odpowiedziała w ciągu 120 s."
          docker compose ps
          docker compose logs --no-color --tail=200 app db
          exit 1

      - name: Smoke test
        run: bash tools/qa-smoke.sh

      - name: Logi przy błędzie
        if: failure()
        run: docker compose logs --no-color --tail=300 app db

      - name: Sprzątanie
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    name: Publikacja
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Nazwa obrazu (GHCR wymaga małych liter)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Konfiguracja Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadane obrazu
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publikacja po teście
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Podsumowanie publikacji
        run: |
          {
            echo "### Publikacja obrazu"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
