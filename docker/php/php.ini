; Konfiguracja PHP dla kontenera aplikacji.
; Szczegóły błędów NIGDY nie mogą trafić do przeglądarki — trafiają tylko do logu.
; Wartość display_errors jest nadpisywana w public/index.php w zależności od APP_ENV
; (local może pokazywać ostrzeżenia, prod nigdy).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL
